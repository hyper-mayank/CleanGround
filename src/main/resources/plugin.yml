name: CleanGround
version: '1.0.0'
main: com.hydrazz.cleanground.CleanGround
api-version: '1.16'
folia-supported: true
author: Hydrazz
description: Modern multi-threaded entity & ground item sweeper for Folia, Paper, and Spigot.
softdepend: [PlaceholderAPI]

commands:
  cleanground:
    description: Core command for CleanGround Pro.
    aliases: [cg, clearlag, cl, groundcleaner]
    permission: cleanground.admin
    usage: /<command> [sweep|cullmobs|count|reload|help]

permissions:
  cleanground.admin:
    description: Full access to CleanGround Pro commands and reload routines.
    default: op
  cleanground.bypass:
    description: Items dropped by players with this permission are never removed.
    default: false
